# /etc/nginx/sites-available/imobmanager
# Substitua imobmanager.example.com pelo domínio real.
# Depois instale o TLS com:
#   sudo certbot --nginx -d imobmanager.example.com --redirect
#
# O Certbot adiciona o bloco 443, os certificados e o redirecionamento.
# Recomenda-se incluir no bloco 443 gerado:
#   ssl_protocols TLSv1.2 TLSv1.3;
#   ssl_session_cache shared:SSL:10m;
#   ssl_session_timeout 1d;
#   ssl_session_tickets off;

upstream imobmanager_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name imobmanager.example.com;

    server_tokens off;
    client_max_body_size 64m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://imobmanager_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 65s;
        proxy_read_timeout 65s;
    }
}
